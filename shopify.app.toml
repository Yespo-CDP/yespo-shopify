# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration


client_id = "862a68630446c3aa82aa67d485ad9077"
name = "Yespo: Email, Push, Pop-ups"
application_url = "https://yespo-app-e02c70c13f7d.herokuapp.com/"
embedded = true
handle = "yespo-app"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/delete" ]
  uri = "/webhook/app/orders"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "shop/update" ]
  uri = "/webhooks/app/shop_update"

  [[webhooks.subscriptions]]
  topics = [ "markets/create", "markets/update", "markets/delete" ]
  uri = "/webhooks/app/markets"

  [[webhooks.subscriptions]]
  topics = [ "carts/update" ]
  uri = "/webhooks/app/carts"

  [[webhooks.subscriptions]]
  topics = [ "customers/update", "customers/create" ]
  uri = "/webhooks/app/customers"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update", "products/delete" ]
  uri = "/webhooks/app/products"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_customers,read_orders,read_products,read_themes,write_app_proxy,write_products,read_translations,read_locales,read_publications,read_markets,unauthenticated_read_product_listings"

[auth]
redirect_urls = [
  "https://yespo-app-e02c70c13f7d.herokuapp.com/auth/callback",
  "https://yespo-app-e02c70c13f7d.herokuapp.com/auth/shopify/callback",
  "https://yespo-app-e02c70c13f7d.herokuapp.com/api/auth/callback"
]

[app_proxy]
url = "https://push.yespo.tech"
subpath = "yespo-proxy"
prefix = "apps"

[pos]
embedded = false